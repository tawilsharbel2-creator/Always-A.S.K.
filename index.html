<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBITAL Mission Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;--bg:#1f3d66;--panel:#274a78;--panel-2:#2f588c;--card:#213f69;--line:#44689a;--line-2:#5d86bd;
  --text:#f5f9fe;--muted:#c6d6e8;--dim:#9db6d3;
  --cyan:#5fe0f5;--amber:#ffc864;--red:#ff7d8f;--green:#6ce8bc;--violet:#b9a2ff;
  --radius:18px;--display:"Space Grotesk",Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);font:17px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:radial-gradient(ellipse 130% 90% at 50% -10%,#6a9bd3 0%,#35609a 42%,var(--bg) 100%) fixed;
}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}

/* Header */
header.top{position:relative;z-index:2;border-bottom:1px solid var(--line);background:#1f3d66b0;backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:84px}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--cyan);display:grid;place-items:center;box-shadow:0 0 28px #5fe0f544;position:relative}
.mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.mark::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed #5fe0f566;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}
.brand h1{font:700 22px/1.1 var(--display);letter-spacing:.04em;margin:6px 0 0}
.brand h1 span{color:var(--cyan)}
.credit{display:flex;align-items:center;gap:12px;padding:10px 18px;border:1px solid var(--line-2);border-radius:999px;background:#1a3352cc;font-size:15px;color:var(--muted);white-space:nowrap}
.credit strong{color:var(--text);font-weight:600}
.credit .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}

/* Stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:36px 0 32px;padding:0;list-style:none}
.stepper button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#274a78b3;text-align:left;transition:.2s}
.stepper button:hover:not(:disabled){border-color:var(--line-2);background:var(--panel-2)}
.stepper button:disabled{opacity:.45;cursor:not-allowed}
.stepper .n{flex-shrink:0;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line-2);font:600 14px var(--mono);color:var(--muted)}
.stepper .lbl{font-weight:600;font-size:15px}
.stepper button.active{border-color:var(--cyan);background:linear-gradient(135deg,#25527a,#1a3756);box-shadow:0 10px 30px -12px #5fe0f566}
.stepper button.active .n{border-color:var(--cyan);color:var(--cyan)}
.stepper button.done .n{background:#1d5249;border-color:#3b9c80;color:var(--green)}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start;padding-bottom:64px}
.stage{min-width:0}
.pagehead{margin-bottom:28px}
.pagehead h2{font:700 clamp(30px,3.4vw,42px)/1.15 var(--display);margin:10px 0 12px;letter-spacing:-.01em}
.pagehead p{margin:0;color:var(--muted);max-width:640px;font-size:18px}
.panel{background:linear-gradient(160deg,#294d7de8,#22436fee);border:1px solid var(--line);border-radius:var(--radius);padding:30px;margin-bottom:28px;box-shadow:0 20px 50px -30px #0008}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.panel-head h3{font:600 22px/1.3 var(--display);margin:0}
.why{color:var(--muted);margin:0 0 22px;max-width:680px;font-size:16px}
.owner{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:#2a2550;border:1px solid #5a4d9c;color:#ddd3ff}
.handoff{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;background:linear-gradient(120deg,#2d2858,#1f2f55);border:1px solid #5a4d9c;margin-bottom:24px;font-size:16px}
.handoff .big{font-size:26px}

/* Cards */
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.dest{display:flex;flex-direction:column;text-align:left;padding:24px;border-radius:16px;border:1px solid var(--line);background:var(--card);transition:.2s;position:relative}
.dest:hover{border-color:var(--line-2);transform:translateY(-2px)}
.dest.sel{border-color:var(--cyan);background:linear-gradient(150deg,#245078,#183554);box-shadow:0 0 0 1px #5fe0f544,0 18px 40px -20px #5fe0f577}
.dest .orbwrap{height:100px;display:grid;place-items:center;margin-bottom:12px}
.orb{width:74px;height:74px;border-radius:50%;box-shadow:inset -14px -10px 20px #000a,0 0 40px #ffffff18}
.orb.moon{background:radial-gradient(circle at 32% 28%,#f6f6ee,#9aa6b4 60%,#4a5669)}
.orb.mars{background:radial-gradient(circle at 32% 26%,#ffc49a,#c25a3c 50%,#5e2a2f)}
.orb.asteroid{width:66px;height:56px;border-radius:38% 55% 42% 50%;transform:rotate(-18deg);background:radial-gradient(circle at 28% 26%,#c0c9cc,#5d6d7c 55%,#283543)}
.orb.europa{background:radial-gradient(circle at 34% 28%,#fffaf0,#d9c7a6 45%,#9b7b5c 75%,#4d3c33);position:relative;overflow:hidden}
.orb.europa::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 9px,#8a4f3a55 9px 11px)}
.dest h4{font:700 23px var(--display);margin:0 0 8px}
.dest p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.55}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.facts div{font-size:14px;font-weight:500}
.facts span{display:block;color:var(--dim);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.diff{position:absolute;top:18px;right:18px;font:600 12px var(--mono);letter-spacing:.06em;padding:5px 11px;border-radius:999px;border:1px solid}
.diff.Easy{color:var(--green);border-color:#3b9c80}.diff.Medium{color:var(--cyan);border-color:#3a8aa0}.diff.Hard{color:var(--amber);border-color:#9c7d3d}.diff.Expert{color:var(--red);border-color:#9c4757}

.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.opt{display:flex;flex-direction:column;gap:10px;text-align:left;padding:22px;border-radius:14px;border:1px solid var(--line);background:var(--card);transition:.18s;min-height:100%}
.opt:hover{border-color:var(--line-2);background:#1c3a5c}
.opt.sel{border-color:var(--cyan);background:linear-gradient(150deg,#245078,#183554);box-shadow:0 0 0 1px #5fe0f544}
.opt-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.opt-name{font:600 18px/1.3 var(--display)}
.radio{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px;transition:.18s}
.opt.sel .radio{border-color:var(--cyan);box-shadow:inset 0 0 0 4px #1e4266,inset 0 0 0 11px var(--cyan)}
.radio.box{border-radius:6px}
.opt.sel .radio.box{box-shadow:none;background:var(--cyan);display:grid;place-items:center}
.opt.sel .radio.box::after{content:"✓";color:#13263d;font-weight:800;font-size:14px}
.opt-desc{color:var(--muted);font-size:15px;line-height:1.5}
.real{font-size:13px;color:#cfc2ff;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font:500 13px var(--mono);padding:4px 10px;border-radius:7px;background:#203f63;color:#d8e6f3;border:1px solid #33567f}
.subhead{font:600 18px var(--display);margin:30px 0 4px}
.subhead:first-of-type{margin-top:0}
.note{padding:14px 18px;border-radius:12px;background:#203f63;border:1px solid #33567f;color:var(--muted);font-size:15px}

/* Team setup */
.size-row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px}
.pill{padding:10px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-weight:600}
.pill.sel{border-color:var(--cyan);background:#245078;color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
.field input{background:#183256;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;font-size:16px;color:var(--text);outline:none;width:100%}
.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5fe0f533}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.role{padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.role .ico{font-size:26px}
.role h5{font:600 17px var(--display);margin:6px 0 2px}
.role p{margin:0 0 10px;font-size:14px;color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.tab{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.tab small{font-weight:500;color:var(--dim)}
.tab.sel{border-color:var(--cyan);background:#245078}
.tab .dotc{width:9px;height:9px;border-radius:50%}

/* Spacecraft preview */
.sc-panel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.sc-svg{width:100%;height:auto;display:block;border-radius:14px;background:radial-gradient(ellipse at 50% 55%,#2b5d8a55,transparent 70%)}
.sc-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.sc-list li{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.sc-list span:first-child{color:var(--muted)}

/* Buttons */
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid #5fe0f5;background:linear-gradient(100deg,#1690ad,#1c6c9b);color:#fff;padding:15px 26px;border-radius:12px;font-weight:600;font-size:16px;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line-2);color:#dbe8f4}
.btn.ghost:hover:not(:disabled){background:#21406a}
.btn.go{background:linear-gradient(100deg,#17a882,#168aa0);border-color:#6ce8bc}
.btn.risky{background:linear-gradient(100deg,#c27a1a,#b0502e);border-color:#ffc864}
.btn.big{padding:18px 34px;font-size:18px}
.btn.small{padding:10px 16px;font-size:14px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

/* HUD */
.hud{position:sticky;top:24px}
.hud .panel{padding:26px;margin-bottom:20px}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.verdict h3{font:600 18px var(--display);margin:0}
.levelline{font-size:13px;color:var(--dim);margin-bottom:18px}
.chip{font:700 12px var(--mono);letter-spacing:.1em;padding:7px 12px;border-radius:999px;border:1px solid;white-space:nowrap}
.chip.good{color:var(--green);border-color:#3b9c80;background:#1d4a44}
.chip.over{color:var(--red);border-color:#9c4757;background:#4a2131}
.chip.warn{color:var(--amber);border-color:#9c7d3d;background:#4a3d1c}
.metric{padding:14px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:0;padding-top:0}
.m-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.m-label{font-weight:600;font-size:15px}
.m-val{font:600 16px var(--display);white-space:nowrap}
.m-sub{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:8px;background:#24456a;border-radius:9px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .35s,background .35s}
.ok-c{color:var(--green)}.warn-c{color:var(--amber)}.bad-c{color:var(--red)}
.bar i.ok{background:var(--green)}.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--red)}.bar i.info{background:var(--cyan)}
.hud-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.hud-actions .btn{padding:11px;font-size:14px}
.save-note{font-size:13px;color:var(--dim);margin:12px 0 0;text-align:center}

/* Review */
.review-top{display:grid;grid-template-columns:180px 1fr;gap:32px;align-items:center}
.gauge{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;position:relative}
.gauge::before{content:"";position:absolute;inset:14px;border-radius:50%;background:#22436f}
.gauge div{position:relative;text-align:center}
.gauge strong{display:block;font:700 44px/1 var(--display)}
.gauge small{font-size:13px;color:var(--muted)}
.review-top h3{font:700 27px var(--display);margin:14px 0 8px}
.review-top p{color:var(--muted);margin:0;font-size:17px}
.checks{display:grid;gap:14px}
.check{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:18px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.check .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px}
.check.pass .ic{background:#1d4a44;color:var(--green)}
.check.warn .ic{background:#4a3d1c;color:var(--amber)}
.check.fail .ic{background:#4a2131;color:var(--red)}
.check h5{margin:0 0 4px;font:600 17px var(--display);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check h5 small{font:500 13px Inter,sans-serif;color:var(--violet)}
.check p{margin:0;font-size:15px;color:var(--muted)}
.check .fix{margin-top:8px;font-size:14px;color:#e2edf7}
.check .fix b{color:var(--cyan)}
.notice{padding:16px 20px;border-radius:12px;background:#4a3d1c;border:1px solid #9c7d3d;color:#ffe7b8;font-size:15px;margin-bottom:20px}
.share{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end}

/* Flight */
.flight-svg{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 50% 100%,#2b5d8a66,transparent 70%);border-radius:14px;border:1px solid var(--line)}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 0}
.dash div{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.dash span{display:block;font-size:13px;color:var(--muted)}
.dash strong{font:700 22px var(--display)}
.phase-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}
.phase{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:center;font-size:14px;color:var(--dim);transition:.3s;font-weight:500}
.phase.now{border-color:var(--cyan);color:var(--text);background:#245078}
.phase.ok{border-color:#3b9c80;color:var(--green)}
.phase.hit{border-color:#9c7d3d;color:var(--amber)}
.phase.lost{border-color:#9c4757;color:var(--red)}
.countdown{font:700 64px/1 var(--display);text-align:center;color:var(--cyan);margin:10px 0;min-height:64px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-height:420px;overflow:auto}
.log li{padding:14px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px;animation:fadein .4s ease}
.log li.good{border-left:4px solid var(--green)}
.log li.caution{border-left:4px solid var(--amber)}
.log li.failure{border-left:4px solid var(--red)}
.log li.info{border-left:4px solid var(--cyan)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.decision{border:1px solid var(--amber);background:linear-gradient(150deg,#4a3d1c,#2e2817);border-radius:16px;padding:26px;margin:22px 0;animation:fadein .4s ease}
.decision h4{font:700 22px var(--display);margin:6px 0 8px}
.decision p{color:#f0e6d0;margin:0 0 20px}
.decision .who{font-size:15px;color:#ffe7b8;margin-bottom:6px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{text-align:left;padding:18px 20px;border-radius:12px;border:1px solid #8a7440;background:#3a3118;transition:.15s}
.choice:hover{border-color:var(--amber);background:#4d4120}
.choice strong{display:block;font:600 17px var(--display);margin-bottom:4px}
.choice span{font-size:14px;color:#e2d6b6}

/* Results */
.result-hero{text-align:center;padding:10px 0 24px}
.stars{font-size:36px;letter-spacing:6px;color:var(--amber)}
.stars .off{color:#36557a}
.result-hero h3{font:700 36px var(--display);margin:8px 0 6px}
.result-hero p{color:var(--muted);margin:0 auto;max-width:560px;font-size:17px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}
.rstat{padding:18px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center}
.rstat strong{display:block;font:700 28px var(--display)}
.rstat span{font-size:13px;color:var(--muted)}
.breakdown{display:grid;gap:8px;margin-bottom:8px}
.bd-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.bd-row span:first-child{color:var(--muted)}
.bd-row.total{border-bottom:0;font-weight:700;font-size:17px}
.bd-row.total span:first-child{color:var(--text)}
.analysis{display:grid;gap:22px}
.an-group h5{display:flex;align-items:center;gap:10px;font:600 17px var(--display);margin:0 0 10px}
.an-group ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.an-group li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:15px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.an-group li.good b{color:var(--green)}.an-group li.bad b{color:var(--red)}.an-group li.meh b{color:var(--amber)}
pre.report{white-space:pre-wrap;background:#122640;border:1px solid var(--line);border-radius:12px;padding:20px;font:13px/1.75 var(--mono);color:#c4d8ea;max-height:300px;overflow:auto;margin:0 0 18px}

/* Leaderboard */
.lb-wrap{overflow-x:auto}
table.lb{width:100%;border-collapse:collapse;font-size:15px;min-width:620px}
.lb th{text-align:left;font:600 12px var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
.lb td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.lb tr.me td{background:#245078}
.lb .rank{font:700 18px var(--display);color:var(--amber)}
.lb .design{font-size:13px;color:var(--muted)}
.lb-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* One question at a time */
.qdots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.qdot{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);font:600 15px var(--mono);color:var(--muted)}
.qdot.done{background:#1d5249;border-color:#3b9c80;color:var(--green)}
.qdot.sel{border-color:var(--cyan);box-shadow:0 0 0 3px #5fe0f544;color:#fff}
.sc-mini{max-width:380px;margin:0 auto}
.lb-msg{font-size:14px;color:var(--amber);margin:0 0 14px}
#lbBtn{white-space:nowrap}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* Footer */

/* =========================================================

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const money = v => (v === Infinity ? "∞" : (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString()) + " MC";
const kg = v => Math.round(v).toLocaleString() + " kg";
const kw = v => (v < 1 ? Math.round(v * 1000) + " W" : v.toFixed(1) + " kW");
const pct = v => Math.round(v * 100) + "%";
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

};

/* ---------- Team & roles ---------- */
const ROLES = [
  { id: "director",  icon: "🧭", name: "Mission Director", job: "Picks where to go, the goal, and how to explore.", color: "#ffc864" },

  { id: "systems",   icon: "⚡", name: "Systems Officer",  job: "Picks power, battery and antenna.",                 color: "#b9a2ff" }
];
const roleById = id => ROLES.find(r => r.id === id);
let team = { size: 0, name: "", names: ["", "", "", ""] };
function playerName(i) { return (team.names[i] || "").trim() || "Player " + (i + 1); }
function ownerOf(roleId) {
  if (team.size <= 1) return "You";
  return playerName(ROLES.findIndex(r => r.id === roleId) % team.size);
}
function teamLabel() {
  if (team.size <= 1) return (team.names[0] || "").trim() || "Solo";

/* ---------- The mission model ---------- */
function compute(s) {
  const d = DEST[s.dest], O = OBJ[s.objective], A = APPROACH[s.approach], Df = DIFF[s.difficulty],
        L = LAUNCH[s.launcher], P = PROP[s.prop], W = POWER[s.power], B = BATTERY[s.battery],
        C = COMMS[s.comms], T = TEST[s.test], LF = LIFE[s.lifetime] || LIFE.standard;
  const tools = s.instr.map(k => ({ key: k, ...INSTR[k] }));
  const landing = s.approach === "land";
  const gear = landing ? d.gear : null;
  const flyby = s.approach === "flyby";
  const budget = Df.sandbox ? Infinity : Math.round(d.budget * Df.budget);

  // Weight: dry spacecraft + fuel from the rocket equation
  const dry = BUS.mass + P.dry + W.mass + B.mass + C.mass + sum(tools, t => t.mass) + T.mass + (gear ? gear.mass : 0);
  const days = P.ion ? d.ionDays : d.days;
  const mainDv = d.dv.flyby + ((s.approach === "orbit" || (landing && d.dv.landViaOrbit)) ? d.dv.orbit : 0);
  const cruiseDv = Math.max(0, mainDv - L.dvBonus);
  const landDv = landing ? d.dv.land : 0;
  const landVe = P.ion ? 3.2 : P.ve;                 // ion engines are too weak to land, so landers carry small chemical thrusters
  const landProp = dry * (Math.exp(landDv / landVe) - 1);
  const boilOff = P.cryo ? 1 - Math.exp(-0.0003 * days) : 0; // cold fuel slowly boils away, so extra must be loaded
  const cruiseProp = (dry + landProp) * (Math.exp(cruiseDv / P.ve) - 1) / (1 - boilOff);
  const propellant = landProp + cruiseProp;
  const wet = dry + propellant;
  const massOK = wet <= L.cap;

  // Power: sunlight gets weaker with the square of distance from the Sun
  const sunlight = 1 / (d.sunAU ** 2);
  const supply = W.solar ? W.rated * sunlight : W.rated;
  const demand = BUS.power + P.power + C.power + sum(tools, t => t.power) + (landing ? 0.1 : 0);
  const powerOK = supply >= demand;

  // Data: how much the antenna can send (weaker with distance squared) vs how much the tools make
  const dataMade = sum(tools, t => t.data);
  const dataCap = C.gain / Math.max(0.05, d.earthAU) ** 2;
  const link = clamp(dataCap / dataMade, 0.05, 1);

  // Money
  const years = flyby ? 0 : LF.years;
  const opsCost = d.ops + d.opsYear * years;
  const cost = BUS.cost + L.cost + P.cost + W.cost + B.cost + C.cost + sum(tools, t => t.cost) + T.cost + (gear ? gear.cost : 0) + opsCost;
  const budgetOK = cost <= budget;

  // Science plan: do the tools and the approach match the goal?
  const fits = tools.map(t => (t.needsLand && !landing) ? 0 : t.fit[s.objective]).sort((a, b) => b - a);
  const toolFit = Math.min(1.15, (fits[0] || 0) + 0.25 * (fits[1] || 0) + 0.1 * (fits[2] || 0));
  const approachFit = A.fit[s.objective];
  const planFit = Math.min(1, toolFit) * approachFit;
  const lifeSci = flyby ? 1 : LF.sci;
  const sci = clamp(Math.round(d.baseSci * O.weight * toolFit * approachFit * lifeSci * link * (powerOK ? 1 : 0.5)), 0, 100);

  // Reliability (game odds)
  const rb = Df.rel;
  const r = x => clamp(x + T.bonus + rb, 0, 0.995);
  const wear = flyby ? 0.3 : LF.wear;
  const overload = massOK ? 1 : Math.pow(clamp(L.cap / wet, 0, 1), 3);
  const p = {
    launch: clamp(L.rel + rb, 0, 0.995) * overload,
    engine: r(P.rel),
    arrive: clamp(d.safety + (T.backup ? 0.02 : 0) + rb, 0, 0.995),
    land: landing ? r(gear.rel) : 1,
    ops: Math.pow(r(W.rel) * r(C.rel) * tools.reduce((a, t) => a * r(t.rel), 1), wear)
  };
  if (Df.sandbox) { p.launch = overload; p.engine = p.arrive = p.land = p.ops = 1; }
  const success = p.launch * p.engine * p.arrive * p.land * p.ops;

  // Checklist
  const bestTool = Object.values(INSTR).find(i => i.best === s.objective);
  let planMsg = `Your tools and approach match "${O.name}".`, planFix = "";
  if (s.objective === "sample" && !landing) { planMsg = "To collect samples you have to land."; planFix = "Mission Director: choose \"Land\"."; }
  else if (tools.some(t => t.needsLand) && !landing) { planMsg = "The Sample Scoop only works if you land."; planFix = "Land, or swap the scoop for another tool."; }
  else if (s.objective === "map" && landing) { planMsg = "From the ground you can only map one small area."; planFix = "Mission Director: \"Go into orbit\" sees the whole surface."; }
  else if (flyby && planFit < 0.8) { planMsg = "Flying past only gives a quick look."; planFix = "Going into orbit or landing gives much more science."; }
  else if (planFit < 0.8) { planMsg = `Your tools aren't great for "${O.name}".`; planFix = `Scientist: add the ${bestTool.name}.`; }

  const checks = [
    { key: "money", role: "director", block: true, pass: budgetOK, title: "Money",
      ok: Df.sandbox ? "Sandbox: money is unlimited." : `You spent ${money(cost)} of ${money(budget)}.`,
      bad: `${money(cost - budget)} over budget. The money could run out and end the mission early.`,
      fix: "Pick cheaper parts, less testing or a shorter mission." },
    { key: "weight", role: "engineer", block: true, pass: massOK, title: "Weight",
      ok: `${kg(wet)} with fuel. The rocket can carry ${kg(L.cap)}.`,
      bad: `Too heavy! ${kg(wet)} with fuel, but the rocket carries ${kg(L.cap)}. The launch might fail.`,
      fix: `${kg(propellant)} of that is fuel. A bigger rocket or a more efficient engine helps.` },
    { key: "power", role: "systems", block: true, pass: powerOK, title: "Power",
      ok: `${kw(supply)} made, ${kw(demand)} needed.`,
      bad: `Only ${kw(supply)} made, but ${kw(demand)} needed. Science tools will only work half the time.`,
      fix: W.solar && sunlight < 0.2 ? "Sunlight is very weak here. Try Giant Solar Wings or Nuclear Generators." : (P.ion ? "The Ion Engine uses lots of power. Get more power or a different engine." : "Get more power, or use fewer tools.") },
    { key: "data", role: "systems", block: false, pass: link >= 0.95, title: "Data",
      ok: "Your antenna can send all your data home.",
      bad: `Your tools make more data than the antenna can send. Only ${pct(link)} will reach Earth.`,
      fix: "Pick a bigger antenna, or fewer data-hungry tools (the camera makes the most)." },
    { key: "plan", role: "scientist", block: false, pass: planFit >= 0.8, title: "Science plan",
      ok: planMsg, bad: planMsg, fix: planFix },
    { key: "risk", role: "engineer", block: false, pass: success >= 0.75, title: "Chance of success",
      ok: `About ${pct(success)} chance everything works.`,
      bad: `Only about ${pct(success)} chance everything works.`,
      fix: "More testing makes parts safer. A long mission gives parts more time to wear out." }
  ];
  const overLimit = checks.filter(c => c.block && !c.pass).length;
  const warnings = checks.filter(c => !c.block && !c.pass).length;

  return { s, d, O, A, Df, L, P, W, B, C, T, LF, tools, landing, flyby, gear, budget, dry, propellant, wet, massOK,
           days, supply, demand, powerOK, sunlight, dataMade, dataCap, link, years, opsCost, cost, budgetOK,
           planFit, toolFit, approachFit, sci, p, success, checks, overLimit, warnings };
}

function tripLabel(days) {
  if (days < 30) return days + " days";
  if (days < 730) return Math.round(days / 30) + " months";
  return (days / 365).toFixed(1).replace(".0", "") + " years";
}

/* ---------- Side panel ---------- */
function metricHTML(emo, label, val, sub, frac, cls) {
  return `<div class="metric">
    <div class="m-row"><span class="m-label">${emo} <span class="lt">${label}</span></span><span class="m-val ${cls}-c">${val}</span></div>
    <div class="m-sub">${sub}</div>
    <div class="bar"><i class="${cls}" style="width:${clamp(frac * 100, 3, 100)}%"></i></div>
  </div>`;
}

function renderHUD() {
  const ms = missing();
  if (ms.length) {
    const total = needed().length, done = total - ms.length;
    $("levelLine").textContent = "Make your choices to see how the mission looks.";
    $("metrics").innerHTML = `<div class="metric"><div class="m-row"><span class="m-label">✅ <span class="lt">Choices made</span></span><span class="m-val">${done} / ${total}</span></div>
      <div class="bar"><i class="info" style="width:${Math.max(3, done / total * 100)}%"></i></div>
      <div class="m-sub" style="margin-top:12px">Still to choose: ${ms.map(x => x[1]).join(", ")}</div></div>`;
    $("verdictChip").textContent = "SETTING UP"; $("verdictChip").className = "chip warn";
    return;
  }
  const m = compute(state);
  const level = (bad, warn) => bad ? "bad" : warn ? "warn" : "ok";
  const sb = m.Df.sandbox;
  $("levelLine").textContent = `${m.d.name} · ${m.Df.name} level · ${teamLabel()}`;
  $("metrics").innerHTML =
    metricHTML("💰", "Money", sb ? money(m.cost) : money(m.cost), sb ? "Sandbox: unlimited" : `You have ${money(m.budget)}`,
      sb ? 0.3 : m.cost / m.budget, sb ? "info" : level(!m.budgetOK, m.cost > m.budget * 0.9)) +
    metricHTML("⚖️", "Weight", kg(m.wet), `Rocket carries ${kg(m.L.cap)}`, m.wet / m.L.cap,
      level(!m.massOK, m.wet > m.L.cap * 0.9)) +
    metricHTML("⚡", "Power", m.powerOK ? "Enough" : "Too little", `${kw(m.supply)} made · ${kw(m.demand)} used`,
      m.powerOK ? clamp(m.demand / m.supply, 0.1, 1) : 1, m.powerOK ? (m.demand / m.supply > 0.85 ? "warn" : "ok") : "bad") +
    metricHTML("📡", "Data home", pct(m.link), "of your science data reaches Earth", m.link,
      level(m.link < 0.5, m.link < 0.95)) +
    metricHTML("🎯", "Success", pct(m.success), "Chance everything works", m.success,
      level(m.success < 0.6, m.success < 0.75));

  const chip = $("verdictChip");
  if (m.overLimit) { chip.textContent = "OVER LIMIT"; chip.className = "chip over"; }
  else if (m.warnings) { chip.textContent = "RISKY"; chip.className = "chip warn"; }
  else { chip.textContent = "ALL GOOD"; chip.className = "chip good"; }
}

/* ---------- Stepper ---------- */
function renderStepper() {
  $("stepper").innerHTML = STEPS.map((lbl, i) => {
    const n = i + 1, cls = n === step ? "active" : (step <= 5 && n < step) ? "done" : "";
    return `<li><button type="button" class="${cls}" data-step="${n}" ${flying && n !== step ? "disabled" : ""} ${n === step ? 'aria-current="step"' : ""}>
      <span class="n">${n < step ? "✓" : n}</span><span class="lbl">${lbl}</span></button></li>`;
  }).join("");
}
$("stepper").addEventListener("click", e => {
  const b = e.target.closest("button[data-step]");
  if (b && !b.disabled) go(+b.dataset.step);
});
function go(n) {
  step = n;
  render();
  window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
}

function ownerBadge(roleId) {
  const r = roleById(roleId);
  return `<span class="owner">${r.icon} ${r.name}${team.size > 1 ? " · " + esc(ownerOf(roleId)) : ""}</span>`;
}
function handoff(roleId) {
  if (team.size <= 1) return "";
  const r = roleById(roleId);
  return `<div class="handoff"><span class="big">${r.icon}</span><div>Pass the device to <b data-owner="${roleId}">${esc(ownerOf(roleId))}</b>, our ${r.name}.</div></div>`;
}
function optCard(group, key, o, selected, tags, multi) {
  return `<button type="button" class="opt ${selected ? "sel" : ""}" data-group="${group}" data-key="${key}" aria-pressed="${selected}">
    <span class="opt-top"><span class="opt-name">${o.name}</span><span class="radio ${multi ? "box" : ""}"></span></span>
    <span class="opt-desc">${o.desc}</span>
    ${o.real ? `<span class="real">🌍 ${o.real}</span>` : ""}

/* ---------- Step 1: Team ---------- */
function renderTeam() {
  const sizes = [1, 2, 3, 4].map(n => `<button type="button" class="pill ${team.size === n ? "sel" : ""}" data-size="${n}">${n === 1 ? "Just me" : n + " players"}</button>`).join("");
  const nameFields = team.size === 0 ? "" : team.size === 1
    ? `<label class="field">Your name<input id="name0" data-name="0" maxlength="20" value="${esc(team.names[0])}" placeholder="Your name"></label>`
    : `<label class="field">Team name<input id="teamname" data-teamname maxlength="24" value="${esc(team.name)}" placeholder="e.g. Rocket Owls"></label>` +
      Array.from({ length: team.size }, (_, i) => `<label class="field">Player ${i + 1}<input id="name${i}" data-name="${i}" maxlength="20" value="${esc(team.names[i])}" placeholder="Player ${i + 1}"></label>`).join("");
  const roles = team.size > 1 ? `<h4 class="subhead">Team jobs</h4><p class="why">${team.size < 4 ? "Some players do two jobs." : "Everyone gets one job."}</p>
      <div class="roles">${ROLES.map(r => `<div class="role" style="border-top:3px solid ${r.color}">
      <div class="ico">${r.icon}</div><h5>${r.name}</h5><p>${r.job}</p>
      <span class="owner" data-owner="${r.id}">${esc(ownerOf(r.id))}</span></div>`).join("")}</div>` : "";
  const diffs = Object.entries(DIFF).map(([k, o]) => optCard("difficulty", k, o, state.difficulty === k)).join("");
  return `
    <div class="pagehead">
      <div class="eyebrow">Step 1</div>
      <h2>Who's playing?</h2>
      <p>Play alone or as a team of up to 4.</p>
    </div>
    <section class="panel">
      <div class="size-row">${sizes}</div>
      ${nameFields ? `<div class="names">${nameFields}</div>` : ""}
      ${roles}
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Pick a level</h3></div>
      <p class="why">You can change it later.</p>
      <div class="opt-grid">${diffs}</div>
    </section>
    <div class="nav"><span></span><button class="btn" type="button" data-nav="2" ${team.size && state.difficulty ? "" : "disabled"}>Next: plan the mission →</button></div>`;
}

/* ---------- Steps 2 and 3: one question at a time ---------- */
const QS = [
  { step: 2, id: "dest", role: "director", title: "Where do you want to go?", why: "Harder places give more money and more to discover.", kind: "dest" },
  { step: 2, id: "objective", role: "director", title: "What is your goal?", why: "Your goal decides which tools you'll need.", data: OBJ },
  { step: 2, id: "approach", role: "director", title: "How will you explore?", why: "Staying in orbit or landing takes extra fuel, which makes the spacecraft heavier.", data: APPROACH, tags: o => [o.fuel] },
  ...["engineer", "scientist", "systems"].flatMap(role => BUILD[role].map(g => ({ step: 3, role, ...g })))
];
const QTITLE = { launcher: "Pick a rocket.", prop: "Pick an engine.", test: "How much testing?", instr: "Pick your science tools.", lifetime: "How long will the mission last?",
  power: "Pick a power source.", battery: "Pick a battery.", comms: "Pick an antenna." };
let qi = { 2: 0, 3: 0 };
const answered = q => q.multi ? state[q.id].length > 0 : !!state[q.id];
const qList = n => QS.filter(q => q.step === n && !(q.hideIf && q.hideIf(state)));
function firstOpen(n) { const i = qList(n).findIndex(q => !answered(q)); return i < 0 ? 0 : i; }

function renderWizard(n) {
  if (n === 3 && qList(2).some(q => !answered(q))) return needPanel("Plan the mission first.");
  const list = qList(n);
  qi[n] = clamp(qi[n], 0, list.length - 1);
  const i = qi[n], q = list[i];
  const Df = DIFF[state.difficulty] || DIFF.engineer;
  const dots = list.map((x, j) => `<button type="button" class="qdot ${j === i ? "sel" : ""} ${answered(x) ? "done" : ""}" data-q="${j}" aria-label="Question ${j + 1}">${answered(x) ? "✓" : j + 1}</button>`).join("");
  let cards;
  if (q.kind === "dest") {
    cards = `<div class="dest-grid">${Object.entries(DEST).map(([k, d]) => `
      <button type="button" class="dest ${state.dest === k ? "sel" : ""}" data-group="dest" data-key="${k}" aria-pressed="${state.dest === k}">
        <span class="diff ${d.diff}">${d.diff.toUpperCase()}</span>
        <span class="orbwrap"><span class="orb ${d.orb}"></span></span>
        <h4>${d.name}</h4>
        <p>${d.blurb}</p>
        <span class="facts">
          <div><span>${d.distWhat}</span>${d.distLabel}</div>
          <div><span>Sunlight</span>${Math.round(100 / d.sunAU ** 2)}%</div>
          <div><span>Money</span>${money(Df.sandbox ? Infinity : Math.round(d.budget * Df.budget))}</div>
        </span>
      </button>`).join("")}</div>`;
  } else {
    cards = `<div class="opt-grid">${Object.entries(q.data).map(([k, o]) => {
      const sel = q.multi ? state[q.id].includes(k) : state[q.id] === k;
      let real = o.real;
      if (q.id === "approach" && k === "land" && state.dest === "mars") real = "Mars' air slows you down, so landing takes less fuel than going into orbit!";
      return optCard(q.id, k, { ...o, real }, sel, q.tags ? q.tags(o, k) : [], q.multi);
    }).join("")}</div>`;
  }
  const last = i === list.length - 1, ok = answered(q);
  const nextLabel = !last ? "Next →" : n === 2 ? "Next: build the spacecraft →" : "Next: check the design →";
  return `
    <div class="pagehead">
      <div class="eyebrow">Step ${n} · Question ${i + 1} of ${list.length}</div>
      <h2>${QTITLE[q.id] || q.title}</h2>
      <p>${q.multi ? "Pick one or more. " : ""}${q.why}</p>
    </div>
    <div class="qdots">${dots}</div>
    ${handoff(q.role)}
    ${n === 3 ? `<section class="panel"><div class="sc-mini">${spacecraftSVG()}</div>${partChips()}</section>` : ""}
    <section class="panel">${cards}</section>
    <div class="nav">
      ${i > 0 ? `<button class="btn ghost" type="button" data-q="${i - 1}">← Back</button>` : `<button class="btn ghost" type="button" data-nav="${n - 1}">← Back</button>`}
      ${last ? `<button class="btn" type="button" data-nav="${n + 1}" ${ok ? "" : "disabled"}>${nextLabel}</button>` : `<button class="btn" type="button" data-q="${i + 1}" ${ok ? "" : "disabled"}>${nextLabel}</button>`}
    </div>`;
}

/* ---------- Spacecraft picture ---------- */
function partChips() {
  const items = [["Rocket", LAUNCH[state.launcher]], ["Engine", PROP[state.prop]], ["Testing", TEST[state.test]],
    ["Tools", state.instr.length ? { name: state.instr.map(k => INSTR[k].name).join(" + ") } : null],
    ["Power", POWER[state.power]], ["Battery", BATTERY[state.battery]], ["Antenna", COMMS[state.comms]]];
  return `<div class="sc-chips">${items.map(([l, o]) => `<span class="sc-chip ${o ? "on" : ""}"><b>${l}</b>${o ? esc(o.name) : "not chosen yet"}</span>`).join("")}</div>`;
}
function spacecraftSVG() {
  const s = state, m = { landing: state.approach === "land" }, cx = 180, by = 70, bw = 64, bh = 60, bx = cx - bw / 2, out = [];
  // power
  if (s.power === "solar" || s.power === "wings") {
    const w = s.power === "wings" ? 118 : 62, h = s.power === "wings" ? 40 : 34, y = by + bh / 2 - h / 2;
    for (const side of [-1, 1]) {
      const x = side < 0 ? bx - 10 - w : bx + bw + 10;
      out.push(`<line x1="${side < 0 ? bx : bx + bw}" y1="${by + bh / 2}" x2="${side < 0 ? x + w : x}" y2="${by + bh / 2}" stroke="#ffffff" stroke-width="4"/>`);
      out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#2f7be0" stroke="#ffffff" stroke-width="2.5"/>`);
      for (let i = 1; i < (s.power === "wings" ? 6 : 3); i++) out.push(`<line x1="${x + i * w / (s.power === "wings" ? 6 : 3)}" y1="${y}" x2="${x + i * w / (s.power === "wings" ? 6 : 3)}" y2="${y + h}" stroke="#cfe4ff" stroke-width="1.4" opacity=".7"/>`);
      out.push(`<line x1="${x}" y1="${y + h / 2}" x2="${x + w}" y2="${y + h / 2}" stroke="#cfe4ff" stroke-width="1.4" opacity=".7"/>`);
    }
  } else if (s.power === "rtg") {
    for (const [dx, dy] of [[-1, 1], [1, 1]]) {
      const x1 = dx < 0 ? bx : bx + bw, y1 = by + bh - 8, x2 = x1 + dx * 46, y2 = y1 + dy * 30;
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffffff" stroke-width="4"/>`);
      out.push(`<g transform="translate(${x2},${y2}) rotate(${dx * -30})"><rect x="-9" y="-18" width="18" height="36" rx="5" fill="#8a94a3" stroke="#ffffff"/>
        ${[-12, -4, 4, 12].map(fy => `<line x1="-15" y1="${fy}" x2="15" y2="${fy}" stroke="#ffffff" stroke-width="2.5"/>`).join("")}
        <circle r="4" fill="#ff9e5e"/></g>`);
    }
  }
  // landing gear
  if (m.landing) {
    for (const side of [-1, 1]) {
      const x1 = side < 0 ? bx + 6 : bx + bw - 6, x2 = x1 + side * 30;
      out.push(`<line x1="${x1}" y1="${by + bh}" x2="${x2}" y2="${by + bh + 44}" stroke="#ffffff" stroke-width="4"/>`);
      out.push(`<line x1="${x2 - 9}" y1="${by + bh + 45}" x2="${x2 + 9}" y2="${by + bh + 45}" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>`);
    }
  }
  // engine
  const ey = by + bh;
  if (s.prop === "ion") {
    out.push(`<ellipse cx="${cx}" cy="${ey + 10}" rx="17" ry="8" fill="#26385a" stroke="#9fd8ff"/>`);
    out.push(`<ellipse cx="${cx}" cy="${ey + 22}" rx="12" ry="14" fill="#6fd0ff" opacity=".45"><animate attributeName="opacity" values=".25;.6;.25" dur="1.6s" repeatCount="indefinite"/></ellipse>`);
  } else if (s.prop) {
    const w2 = s.prop === "cryo" ? 30 : 24, h2 = s.prop === "cryo" ? 30 : 24;
    out.push(`<path d="M${cx - 9} ${ey} L${cx + 9} ${ey} L${cx + w2 / 2} ${ey + h2} L${cx - w2 / 2} ${ey + h2} Z" fill="#aab6c4" stroke="#ffffff"/>`);
    if (s.prop === "cryo") out.push(`<path d="M${cx - 5} ${ey + 2} h10" stroke="#bfefff" stroke-width="4"/>`);
  }
  // body
  out.push(`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="7" fill="url(#foil)" stroke="#f6d77a" stroke-width="2.5"/>`);
  if (s.battery === "large") out.push(`<rect x="${bx + 10}" y="${by + 36}" width="20" height="12" rx="2" fill="#1d4a44" stroke="#6ce8bc"/><rect x="${bx + 30}" y="${by + 39}" width="3" height="6" fill="#6ce8bc"/><rect x="${bx + 12}" y="${by + 38}" width="14" height="8" fill="#6ce8bc"/>`);
  if (s.test === "extensive") out.push(`<text x="${bx + bw - 8}" y="${by + 16}" font-size="12" text-anchor="end" fill="#13263d" font-weight="700">2×</text>`);
  // antenna
  const ay = by;
  if (s.comms === "lowGain") out.push(`<line x1="${cx}" y1="${ay}" x2="${cx}" y2="${ay - 30}" stroke="#ffffff" stroke-width="4"/><circle cx="${cx}" cy="${ay - 32}" r="4" fill="#ffffff"/>`);
  else if (s.comms) {
    const r = s.comms === "bigDish" ? 40 : 24;
    out.push(`<line x1="${cx}" y1="${ay}" x2="${cx}" y2="${ay - 10}" stroke="#ffffff" stroke-width="4"/>`);
    out.push(`<path d="M${cx - r} ${ay - 10 - r * 0.55} Q${cx} ${ay - 2} ${cx + r} ${ay - 10 - r * 0.55} Z" fill="#e8edf3" stroke="#ffffff"/>`);
    out.push(`<line x1="${cx}" y1="${ay - 10}" x2="${cx}" y2="${ay - 18 - r * 0.6}" stroke="#ffffff" stroke-width="2.5"/>`);
  }

  if (s.instr.includes("camera")) out.push(`<rect x="${bx + bw - 4}" y="${by + 6}" width="16" height="14" rx="3" fill="#2b2f3a" stroke="#ffffff"/><circle cx="${bx + bw + 14}" cy="${by + 13}" r="5" fill="#5fe0f5" stroke="#ffffff"/>`);
  if (s.instr.includes("spectro")) out.push(`<rect x="${bx - 16}" y="${by + 4}" width="18" height="18" rx="3" fill="#3b2f5e" stroke="#b9a2ff"/><circle cx="${bx - 7}" cy="${by + 13}" r="4" fill="#b9a2ff"/>`);
  if (s.instr.includes("scoop")) out.push(`<path d="M${bx + bw} ${by + bh - 10} l22 14 l10 18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/><path d="M${bx + bw + 26} ${by + bh + 22} q6 10 14 2" fill="#ffc864" stroke="#ffffff"/>`);

  return `<svg class="sc-svg" viewBox="10 14 340 172" role="img" aria-label="Picture of your spacecraft">
    <defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e0a93a"/><stop offset="1" stop-color="#b9822a"/></linearGradient></defs>
    ${out.join("")}</svg>`;
}

/* ---------- Flight ---------- */
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 200) : ms));
const roll = p => Math.random() < p;
let craftProgress = 0;
function moveCraft(to, ms = 1400) {
  const path = $("traj"), done = $("trajDone"), craft = $("craft");
  if (!path) return Promise.resolve();
  const len = path.getTotalLength();
  done.style.strokeDasharray = len;
  const from = craftProgress, start = performance.now(), dur = REDUCED ? 1 : ms;
  return new Promise(res => {
    function frame(t) {
      const k = clamp((t - start) / dur, 0, 1);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = path.getPointAtLength((from + (to - from) * e) * len);
      craft.setAttribute("transform", `translate(${pt.x},${pt.y})`);
      done.style.strokeDashoffset = len * (1 - (from + (to - from) * e));
      if (k < 1) requestAnimationFrame(frame); else { craftProgress = to; res(); }
    }
    requestAnimationFrame(frame);
  });
}
function countTo(id, from, to, suffix = "", ms = 900) {
  const el = $(id); if (!el) return Promise.resolve();
  const start = performance.now(), dur = REDUCED ? 1 : ms;
  return new Promise(res => {
    function f(t) {
      const k = clamp((t - start) / dur, 0, 1);
      el.textContent = Math.round(from + (to - from) * k).toLocaleString() + suffix;
      if (k < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}
function setPhase(id, cls) { const el = $("ph-" + id); if (el) el.className = "phase " + cls; }

/* A decision: each option has p (chance it goes wrong), good (science multiplier if fine), bad (if it goes wrong) */
function ask(roleId, title, body, options) {
  return new Promise(resolve => {
    const r = roleById(roleId);
    const slot = $("decisionSlot");
    slot.innerHTML = `<div class="decision" role="alertdialog" aria-label="${esc(title)}">
      <div class="who">${r.icon} <b>${esc(team.size > 1 ? ownerOf(roleId) : "You")}</b>${team.size > 1 ? ", our " + r.name + "," : ""} decide${team.size > 1 ? "s" : ""}:</div>
      <h4>${esc(title)}</h4><p>${esc(body)}</p>
      <div class="choice-grid">${options.map((o, i) => `<button type="button" class="choice" data-i="${i}"><strong>${esc(o.label)}</strong><span>${esc(o.hint)}</span></button>`).join("")}</div>
    </div>`;
    slot.querySelector(".decision").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" });
    slot.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
      slot.innerHTML = "";
      resolve(options[+b.dataset.i]);
    }, { once: true }));
  });
}
const ev = o => (1 - o.p) * o.good + o.p * o.bad;  // expected science multiplier

function hazardFor(m) {
  const risk = x => clamp(x * m.T.riskMult * m.Df.risk, 0, 0.95);
  const batt = m.B.store >= 1 ? 0.4 : 1;
  const k = state.dest, land = m.landing;
  if (k === "moon" && land) {
    if (!m.W.solar) return { info: "Night falls for about 14 Earth days. Your nuclear generators keep everything running!", mult: 1.05 };
    return { role: "systems", title: "Lunar night is coming", body: "Night here lasts about 14 Earth days. No sunlight means no solar power, and it gets colder than −170 °C.",
      options: [
        { label: "Go to sleep", hint: "Safe. You lose some science.", p: 0, good: 0.85, bad: 0.85, ok: "The lander slept and woke at sunrise." },
        { label: "Keep working on battery", hint: `${pct(risk(0.5 * batt))} chance the cold breaks something.${m.B.store >= 1 ? " Your large battery helps!" : ""}`, p: risk(0.5 * batt), good: 1.0, bad: 0.6, ok: "The battery lasted all night!", fail: "The battery ran out and some parts froze.", drain: true }
      ] };
  }
  if (k === "mars" && land) {
    if (!m.W.solar) return { info: "A huge dust storm hits. Nuclear power doesn't need sunlight, so you keep working!", mult: 1.05 };
    return { role: "systems", title: "Dust storm!", body: "A dust storm is blocking the Sun. In 2018 a storm like this ended the solar-powered Opportunity rover.",
      options: [
        { label: "Power down and wait", hint: "Safe. You lose some science.", p: 0, good: 0.8, bad: 0.8, ok: "The lander waited out the storm." },
        { label: "Keep working", hint: `${pct(risk(0.45 * batt))} chance the power runs out.${m.B.store >= 1 ? " Your large battery helps!" : ""}`, p: risk(0.45 * batt), good: 1.1, bad: 0.5, ok: "You studied the storm up close — amazing data!", fail: "The power ran out. Some systems never came back.", drain: true }
      ] };
  }
  if (k === "asteroid" && land) return { role: "director", title: "Boulders everywhere!", body: "The best spot to touch down is covered in boulders.",
    options: [
      { label: "Touch down there anyway", hint: `Better science, ${pct(risk(0.35))} chance of damage.`, p: risk(0.35), good: 1.15, bad: 0.6, ok: "Perfect touchdown between the boulders!", fail: "A boulder hit the spacecraft. Some tools broke." },
      { label: "Pick a safer spot", hint: "Safe, a little less science.", p: 0, good: 0.9, bad: 0.9, ok: "Touched down safely on a smooth spot." }
    ] };
  if (k === "europa") return { role: "scientist", title: "Dangerous radiation", body: "Jupiter blasts the area around Europa with radiation that can damage electronics.",
    options: [
      { label: land ? "Shield the tools" : "Stay farther away", hint: "Safe, but less detail.", p: 0, good: 0.85, bad: 0.85, ok: "Played it safe and stayed healthy." },
      { label: land ? "Keep all tools out" : "Fly in close", hint: `Better science, ${pct(risk(0.35))} chance of damage.`, p: risk(0.35), good: 1.2, bad: 0.55, ok: "Incredible close-up data of the icy surface!", fail: "Radiation damaged the electronics." }
    ] };
  const flavor = {
    moon: ["Lumpy gravity", "The Moon's gravity is uneven, so very low orbits slowly get pulled down."],
    asteroid: ["Flying pebbles", "The asteroid is throwing off small pebbles. Getting close is risky."],
    mars: ["Low pass", "Dipping lower through the thin air gives sharper pictures, but it shakes the spacecraft."]
  }[k];
  return { role: "director", title: flavor[0], body: flavor[1] + " How close should you go?",
    options: [
      { label: "Go in close", hint: `Better science, ${pct(risk(0.3))} chance of trouble.`, p: risk(0.3), good: 1.15, bad: 0.65, ok: "Super-sharp close-ups!", fail: "Got too close and damaged a tool." },
      { label: "Stay at a safe height", hint: "Safe, a little less detail.", p: 0, good: 0.92, bad: 0.92, ok: "Steady and safe." }
    ] };
}

async function runFlight() {
  if (flying) return;
  flying = true;
  renderStepper();
  const m = compute(state);
  const sb = m.Df.sandbox;
  const riskOf = x => clamp(x * m.T.riskMult * m.Df.risk, 0, 0.95);
  const breaks = p => sb ? false : !roll(p);   // sandbox: nothing breaks by chance
  let mult = 1, lost = false, lostAt = "", extraCost = 0, battery = 100, reachedOps = false;
  const events = [], decisions = [], notes = [];
  const log = (text, kind = "info") => {
    const li = document.createElement("li");
    li.className = kind; li.textContent = text;
    $("log").prepend(li);
    events.push(text);
  };
  async function decide(roleId, title, body, options) {
    const c = await ask(roleId, title, body, options);
    const bad = c.p > 0 && roll(c.p);
    const best = Math.max(...options.map(ev));
    decisions.push({ role: roleId, title, label: c.label, good: ev(c) >= best - 0.02, risky: c.p > 0, went: bad ? "bad" : "ok" });
    mult *= bad ? c.bad : c.good;
    if (c.drain) { battery = bad ? 0 : Math.round(100 - 70 / m.B.store * 0.5); $("dBat").textContent = battery + "%"; }
    log(`${title} — ${c.label}. ${bad ? c.fail : c.ok}`, bad ? "failure" : c.p > 0 ? "good" : "caution");
    return !bad;
  }

  $("beginBtn").remove();
  $("launchNav").style.display = "none";
  const cd = $("countdown");
  for (const t of ["3", "2", "1", "LIFTOFF!"]) { cd.textContent = t; await sleep(650); }
  cd.textContent = "";

  // 1. Launch
  setPhase("launch", "now");
  log(`🚀 Liftoff on the ${m.L.name}!`);
  if (!m.massOK) log("The rocket is overloaded and struggling to climb…", "caution");
  await moveCraft(0.1, 1100);
  if (roll(m.p.launch)) { log("The spacecraft made it to space.", "good"); setPhase("launch", "ok"); }
  else {
    lost = true; lostAt = "launch";
    log(m.massOK ? "The rocket had a problem and the launch failed." : "Too heavy — the rocket couldn't reach space.", "failure");
    setPhase("launch", "lost");
  }

  // 2. Travel
  if (!lost) {
    setPhase("cruise", "now");
    log(`Travelling to ${m.d.name}. The trip takes about ${tripLabel(m.days)}.`);
    await Promise.all([moveCraft(0.4, 1300), countTo("dDay", 0, Math.round(m.days * 0.4))]);
    await decide("systems", "Solar storm!", "The Sun just blasted out a burst of radiation. It will hit the spacecraft soon.", [
      { label: "Power down extra systems", hint: "Safe. A small delay.", p: 0, good: 0.97, bad: 0.97, ok: "Powering down protected the electronics." },
      { label: "Keep everything on", hint: `${pct(riskOf(0.25))} chance of damage.`, p: riskOf(0.25), good: 1.0, bad: 0.8, ok: "The spacecraft got through fine.", fail: "The radiation glitched the computer." }
    ]);
    await Promise.all([moveCraft(0.7, 1200), countTo("dDay", Math.round(m.days * 0.4), Math.round(m.days * 0.75))]);
    let engineHit = false;
    if (!breaks(m.p.engine)) log("The engine is working perfectly.", "good");
    else if (m.T.backup) { log("The engine broke — but the backup took over. Testing paid off!", "caution"); engineHit = true; }
    else {
      engineHit = true;
      await decide("engineer", "Engine trouble!", "The main engine stopped during a burn. There's no backup.", [
        { label: "Try a restart", hint: `${pct(riskOf(0.4))} chance it fails for good.`, p: riskOf(0.4), good: 1.0, bad: 0.4, ok: "The restart worked!", fail: "The restart failed. You arrive in a bad orbit." },
        { label: "Limp on with small thrusters", hint: "Safe, but a worse orbit.", p: 0, good: 0.65, bad: 0.65, ok: "The small thrusters got you there slowly." }
      ]);
    }
    setPhase("cruise", engineHit ? "hit" : "ok");
  }

  // 3. Arrive (and land)
  if (!lost) {
    setPhase("arrive", "now");
    await Promise.all([moveCraft(0.94, 1200), countTo("dDay", Math.round(m.days * 0.75), m.days)]);
    if (breaks(m.p.arrive)) { lost = true; lostAt = "arrival"; log(`Contact was lost while arriving at ${m.d.name}.`, "failure"); setPhase("arrive", "lost"); }
    else {
      log(`Arrived at ${m.d.name}${m.s.approach === "orbit" ? " and went into orbit" : ""}! 🎉`, "good");
      if (m.landing) {
        await sleep(700);
        if (breaks(m.p.land)) { lost = true; lostAt = "landing"; log(`The ${m.gear.name.toLowerCase()} failed. The lander crashed.`, "failure"); setPhase("arrive", "lost"); }
        else { log("Touchdown! The lander is safe on the surface.", "good"); setPhase("arrive", "ok"); }
      } else setPhase("arrive", "ok");
    }
  }

  // 4. Science
  if (!lost) {
    reachedOps = true;
    setPhase("ops", "now");
    await moveCraft(1, 700);
    let hit = false;
    const hz = hazardFor(m);
    if (hz.info) { mult *= hz.mult; log(hz.info, "good"); }
    else hit = !(await decide(hz.role, hz.title, hz.body, hz.options));
    await sleep(600);
    if (!m.powerOK) { log("Not enough power — the tools could only work half the time.", "caution"); hit = true; }
    if (breaks(m.p.ops)) { mult *= 0.6; hit = true; log(`One of the science tools broke partway through the mission.`, "failure"); }
    else log(`The ${m.tools.map(t => t.name).join(" and ")} ${m.tools.length > 1 ? "are" : "is"} collecting data.`, "good");
    if (!m.budgetOK) {
      const over = (m.cost - m.budget) / m.budget;
      mult *= Math.max(0.3, 1 - over * 2); hit = true;
      log("The money ran out! The mission had to end early.", "failure");
    }
    // Extend the mission? (Scientist)
    if (!m.flyby && !hit) {
      const yr = m.d.opsYear, wearP = sb ? 0 : clamp(1 - Math.pow(m.p.ops, 1 / Math.max(0.6, m.LF.wear)), 0.03, 0.6);
      const affordable = m.Df.sandbox || m.cost + yr <= m.budget;
      const ok = await decide("scientist", "Everything's working!", `The spacecraft is healthy. Keep going for one more year? It costs ${money(yr)}.`, [
        { label: "Extend one more year", hint: `+15% science, ${pct(wearP)} chance a tool wears out.${affordable ? "" : " You'll go over budget!"}`, p: wearP, good: affordable ? 1.15 : 0.95, bad: 0.85, ok: "One extra year of discoveries!", fail: "A tool wore out during the extra year.", extend: true },
        { label: "Finish on time", hint: "Safe. Keep your leftover money.", p: 0, good: 1, bad: 1, ok: "Mission completed on schedule." }
      ]);
      const last = decisions[decisions.length - 1];
      if (last.label.startsWith("Extend")) extraCost = yr;
    }
    setPhase("ops", hit ? "hit" : "ok");

    // 5. Send home
    setPhase("data", "now");
    let dataHome = m.link;
    if (breaks(clamp(m.C.rel + m.T.bonus + m.Df.rel, 0, 0.995))) { dataHome *= 0.75; log("The antenna had a glitch. Some data was lost.", "caution"); }
    await countTo("dData", 0, Math.round(dataHome * 100), "%", 1100);
    if (dataHome < 0.95) { log(`Only ${pct(dataHome)} of the data made it to Earth.`, "caution"); setPhase("data", "hit"); }
    else { log("All the data arrived on Earth! 📡", "good"); setPhase("data", "ok"); }
    mult *= dataHome / m.link;
  }

  showResult(score(m, { lost, lostAt, mult, decisions, events, extraCost, reachedOps }));
  flying = false;
  renderStepper();
}

/* ---------- Scoring & analysis ---------- */
function score(m, f) {
  const science = f.lost ? 0 : clamp(Math.round(m.sci * f.mult), 0, 100);
  const spent = m.cost + f.extraCost;
  const objectiveMet = !f.lost && m.planFit >= 0.8 && science >= 20;
  const pts = {};
  pts.science = Math.round(science * 0.6);
  pts.goal = objectiveMet ? 15 : 0;
  if (m.Df.sandbox) pts.money = 0;
  else {
    const left = m.budget - spent;
    pts.money = Math.round(left >= 0 ? Math.min(15, (left / m.budget) * 50) : Math.max(-20, (left / m.budget) * 100));
  }
  pts.decisions = f.decisions.length ? Math.round(10 * f.decisions.filter(d => d.good).length / f.decisions.length) : 10;
  pts.team = m.overLimit + m.warnings === 0 ? 5 : 0;
  let total = f.lost ? Math.round(pts.decisions / 2) : pts.science + pts.goal + pts.money + pts.decisions + pts.team;
  total = clamp(total, 0, 100);
  const outcome = f.lost ? "Mission lost" : total >= 75 ? "Amazing mission!" : total >= 50 ? "Mission success" : total >= 25 ? "Partly successful" : "Barely made it";
  const stars = f.lost ? 0 : total >= 85 ? 5 : total >= 70 ? 4 : total >= 50 ? 3 : total >= 30 ? 2 : 1;
  return { m, ...f, science, spent, objectiveMet, pts, total, outcome, stars };
}

function analysis(r) {
  const m = r.m, A = [];
  const add = (role, kind, text) => A.push({ role, kind, text });
  // Director
  add("director", r.objectiveMet ? "good" : "bad", r.objectiveMet ? `Goal reached: "${m.O.name}".` : r.lost ? `Goal not reached — the mission was lost during ${r.lostAt}.` : `Goal not reached: ${m.checks.find(c => c.key === "plan").bad}`);
  if (!m.Df.sandbox) add("director", r.spent <= m.budget ? "good" : "bad", r.spent <= m.budget ? `Spent ${money(r.spent)} of ${money(m.budget)} — ${money(m.budget - r.spent)} left over.` : m.budgetOK ? `Extending the mission put you ${money(r.spent - m.budget)} over budget.` : `Went ${money(m.cost - m.budget)} over budget, so the mission was cut short.`);
  // Engineer
  add("engineer", m.massOK ? "good" : "bad", m.massOK ? `Weight was fine: ${kg(m.wet)} on a rocket that carries ${kg(m.L.cap)}.` : `The spacecraft was ${kg(m.wet - m.L.cap)} too heavy for the ${m.L.name}${r.lostAt === "launch" ? ", so the launch failed" : ""}. ${kg(m.propellant)} of it was fuel.`);
  if (m.P.cryo && m.days > 300) add("engineer", "meh", `On a ${tripLabel(m.days)} trip, the Super-Cold Engine's fuel boils away, so extra had to be loaded.`);
  if (m.P.ion) add("engineer", "meh", `The Ion Engine saved lots of fuel, but the trip took ${tripLabel(m.days)}.`);
  add("engineer", m.T.backup ? "good" : m.T.cost ? "good" : "meh", m.T.backup ? "Backups were on board in case parts broke." : m.T.cost ? "Normal testing made parts a bit safer." : "No extra testing — cheaper, but riskier.");
  // Scientist
  add("scientist", r.science >= 50 ? "good" : r.science >= 25 ? "meh" : "bad", `Science points: ${r.science} of 100.`);
  if (m.tools.length > 1) add("scientist", "good", `Using ${m.tools.length} tools together gave extra science, but cost more weight, power and data.`);
  if (m.planFit < 0.8) add("scientist", "bad", m.checks.find(c => c.key === "plan").fix);
  // Systems
  add("systems", m.powerOK ? "good" : "bad", m.powerOK ? `Power was enough: ${kw(m.supply)} made, ${kw(m.demand)} used.` : `Not enough power at ${m.d.name}: sunlight there is only ${Math.round(m.sunlight * 100)}% of Earth's.`);
  add("systems", m.link >= 0.95 ? "good" : "bad", m.link >= 0.95 ? "The antenna sent all the data home." : `The antenna could only send ${pct(m.link)} of the data. Data travels slower from far away.`);
  // Decisions
  r.decisions.forEach(d => add(d.role, d.good ? "good" : "meh",
    `${d.title} You chose "${d.label}". ${d.good ? "Smart call for this design." : "A different choice was safer or better here."}${d.risky && d.went === "bad" ? " Bad luck this time!" : ""}`));
  return A;
}

/* ---------- Leaderboard ---------- */
const LB_KEY = "orbitalMissionControl.leaderboard.v1";
function lbAll() { const v = store.get(LB_KEY); return Array.isArray(v) ? v : []; }
let gdb = null, globalRows = [], globalState = "loading", globalWriteFailed = false, lbScope = "global";
function cleanEntry(d, id) {   // rows written by other players are untrusted: keep only plain, bounded values
  if (!d || typeof d !== "object") return null;
  return { id: String(id), team: String(d.team || "Team").slice(0, 40), dest: String(d.dest || ""), objective: String(d.objective || ""),
    difficulty: String(d.difficulty || ""), score: clamp(Number(d.score) || 0, 0, 100), science: clamp(Number(d.science) || 0, 0, 100),
    spent: Number(d.spent) || 0, design: String(d.design || "").slice(0, 220), code: String(d.code || "").slice(0, 700) };
}
function refreshLB() { const el = $("lbPanel"); if (el) el.outerHTML = leaderboardPanel(); }
(async () => {
  try { gdb = (window.claude && window.claude.use) ? await window.claude.use("db") : null; } catch (e) { gdb = null; }
  if (!gdb) { globalState = "off"; refreshLB(); return; }
  const timer = setTimeout(() => { if (globalState === "loading") { globalState = "off"; refreshLB(); } }, 10000);
  try {
    gdb.collection("scores").orderBy("score", "desc").limit(100).onSnapshot(snap => {
      clearTimeout(timer); globalState = "on";
      globalRows = snap.docs.map(d => cleanEntry(d.data(), d.id)).filter(Boolean).sort((a, b) => b.score - a.score);
      refreshLB();
    }, () => { clearTimeout(timer); if (globalState !== "on") { globalState = "off"; refreshLB(); } });
  } catch (e) { clearTimeout(timer); globalState = "off"; refreshLB(); }
})();

function lbAdd(r) {
  const entry = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    team: teamLabel(), dest: state.dest, objective: state.objective, difficulty: state.difficulty,
    score: r.total, science: r.science, spent: Math.round(r.spent),
    design: [r.m.A.name, r.m.L.name, r.m.P.name, r.m.W.name, r.m.C.name, r.m.tools.map(t => t.name).join(" + ")].join(" · "),
    code: designCode()
  };
  const all = lbAll(); all.push(entry);
  all.sort((a, b) => b.score - a.score);
  store.set(LB_KEY, all.slice(0, 100));
  if (gdb) {
    try { gdb.collection("scores").doc(entry.id).set(entry).catch(() => { globalWriteFailed = true; refreshLB(); }); }
    catch (e) { globalWriteFailed = true; }
  }
  return entry.id;
}
function leaderboardPanel() {
  const useGlobal = lbScope === "global" && globalState === "on";
  const src = useGlobal ? globalRows : lbAll().map(e => cleanEntry(e, e.id)).filter(Boolean);
  const canFilter = state.dest && state.objective;
  const rows = (lbFilter === "this" && canFilter ? src.filter(e => e.dest === state.dest && e.objective === state.objective) : src).slice(0, 15);
  let msg = "";
  if (lbScope === "global" && globalState === "loading") msg = "Loading the global leaderboard…";
  else if (lbScope === "global" && globalState === "off") msg = "The global leaderboard isn't reachable right now, so these are the scores from this device. Open the game from its shared link while signed in to see everyone's.";
  else if (useGlobal && globalWriteFailed) msg = "Your score was saved on this device, but you don't have permission to post to the global leaderboard.";
  const body = rows.length ? rows.map((e, i) => `<tr class="${e.id === lastEntryId ? "me" : ""}">
      <td class="rank">${i + 1}</td>
      <td><b>${esc(e.team)}</b><div class="design">${esc(DIFF[e.difficulty] ? DIFF[e.difficulty].name : "")}</div></td>
      <td>${esc(DEST[e.dest] ? DEST[e.dest].name : "")}<div class="design">${esc(OBJ[e.objective] ? OBJ[e.objective].name : "")}</div></td>
      <td><b>${e.score}</b></td><td>${e.science}</td><td>${money(e.spent)}</td>
      <td class="design">${esc(e.design)}</td>
      <td><button class="btn ghost small" type="button" data-trycode="${esc(e.code)}">Try it</button></td></tr>`).join("")
    : `<tr><td colspan="8" class="design">No missions here yet. Be the first!</td></tr>`;
  return `<section class="panel" id="lbPanel">
    <div class="panel-head"><h3>🏆 Leaderboard</h3>
      <div class="lb-tools">
        <button class="pill ${lbScope === "global" ? "sel" : ""}" type="button" data-lbscope="global">🌍 Global</button>
        <button class="pill ${lbScope === "device" ? "sel" : ""}" type="button" data-lbscope="device">This device</button>
      </div></div>
    <div class="lb-tools" style="margin:10px 0 16px">
      ${canFilter ? `<button class="pill ${lbFilter === "this" ? "sel" : ""}" type="button" data-lb="this">This mission</button>` : ""}
      <button class="pill ${lbFilter === "all" || !canFilter ? "sel" : ""}" type="button" data-lb="all">All missions</button>
    </div>
    ${msg ? `<p class="lb-msg">${msg}</p>` : ""}
    <div class="lb-wrap"><table class="lb"><thead><tr><th>#</th><th>Team</th><th>Mission</th><th>Score</th><th>Science</th><th>Spent</th><th>Design</th><th></th></tr></thead>
    <tbody>${body}</tbody></table></div>
  </section>`;
}
function renderLBPage() {
  return `<div class="pagehead"><div class="eyebrow">Hall of fame</div><h2>Leaderboard</h2><p>The best missions from every team. Tap "Try it" to load a design.</p></div>
    ${leaderboardPanel()}
    <div class="nav"><button class="btn ghost" type="button" data-nav="1">← Back to the game</button><span></span></div>`;
}

function showResult(r) {
  const m = r.m;
  lastEntryId = m.Df.sandbox ? null : lbAdd(r);
  const msg = r.lost
    ? `The mission was lost during ${r.lostAt}. Real space agencies lose missions too — see why below and try again!`
    : r.total >= 75 ? "Scientists will be studying your discoveries for years!"
    : r.total >= 50 ? "Good job! Read the analysis to push your score even higher."
    : "You made it, but a lot went wrong. The analysis shows what to change.";
  const bd = [
    ["🔬 Science", r.pts.science, "60"], ["🎯 Goal reached", r.pts.goal, "15"],
    ["💰 Money left", r.pts.money, "15"], ["🧠 Smart decisions", r.pts.decisions, "10"],
    [team.size > 1 ? "🤝 Teamwork bonus (all green)" : "✅ All-green bonus", r.pts.team, "5"]
  ];
  const groups = ROLES.map(role => {
    const items = analysis(r).filter(a => a.role === role.id);
    if (!items.length) return "";
    return `<div class="an-group"><h5>${role.icon} ${role.name}${team.size > 1 ? ` <span class="owner">${esc(ownerOf(role.id))}</span>` : ""}</h5>
      <ul>${items.map(a => `<li class="${a.kind}"><b>${a.kind === "good" ? "✓" : a.kind === "bad" ? "✕" : "!"}</b><span>${esc(a.text)}</span></li>`).join("")}</ul></div>`;
  }).join("");

  $("resultSlot").innerHTML = `
    <section class="panel" id="resultPanel">
      <div class="result-hero">
        <div class="stars">${[1, 2, 3, 4, 5].map(i => `<span class="${i <= r.stars ? "" : "off"}">★</span>`).join("")}</div>
        <h3 class="${r.lost ? "bad-c" : ""}">${r.outcome}</h3>
        <p>${msg}</p>
      </div>
      <div class="result-grid">
        <div class="rstat"><strong>${r.total}</strong><span>Score (out of 100)</span></div>
        <div class="rstat"><strong>${r.science}</strong><span>Science points</span></div>
        <div class="rstat"><strong class="${m.Df.sandbox || r.spent <= m.budget ? "ok-c" : "bad-c"}">${m.Df.sandbox ? money(r.spent) : money(m.budget - r.spent)}</strong><span>${m.Df.sandbox ? "Spent (sandbox)" : r.spent <= m.budget ? "Money left" : "Over budget"}</span></div>
      </div>
      <h4 class="subhead">How your score was made</h4>
      <div class="breakdown">
        ${r.lost ? `<div class="bd-row"><span>Mission lost — only half your decision points count</span><span>${r.total}</span></div>` :
          bd.map(([a, v, max]) => `<div class="bd-row"><span>${a}</span><span>${v} / ${max}</span></div>`).join("")}
        <div class="bd-row total"><span>Total</span><span>${r.total} / 100</span></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Why it went this way</h3></div>
      <p class="why">What each job did well, and what to change next time.</p>
      <div class="analysis">${groups}</div>
    </section>
    ${m.Df.sandbox ? `<section class="panel"><p class="why" style="margin:0">Sandbox missions don't go on the leaderboard. Switch level on the Team step to compete.</p></section>` : leaderboardPanel()}
    <section class="panel">
      <div class="panel-head"><h3>Mission report</h3></div>
      <pre class="report" id="reportText">${esc(buildReport(r))}</pre>
      <div class="btn-row">
        <button class="btn go" type="button" id="againBtn">Fly again</button>
        <button class="btn ghost" type="button" data-nav="3">Change spacecraft</button>
        <button class="btn ghost" type="button" data-nav="2">New mission</button>
        <button class="btn ghost" type="button" id="copyBtn">Copy report</button>
      </div>
    </section>`;
  $("resultPanel").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
  $("copyBtn").addEventListener("click", () => copyText($("reportText").textContent, $("copyBtn"), "Copy report"));
  $("againBtn").addEventListener("click", () => render());
}

function buildReport(r) {
  const m = r.m, line = "─".repeat(40);
  const crew = team.size > 1 ? ROLES.map(x => `${x.name}: ${ownerOf(x.id)}`) : ["Solo mission"];
  return [
    "ORBITAL MISSION CONTROL — MISSION REPORT", "Made by Always A.S.K.", line,
    `Team:         ${teamLabel()} (${m.Df.name} level)`, ...crew.map(c => "  " + c), "",
    `Destination:  ${m.d.name} — ${m.A.name}`, `Goal:         ${m.O.name}`, `Result:       ${r.outcome}`,
    `Score:        ${r.total}/100   Science: ${r.science}/100`, "",
    "SPACECRAFT", line,
    `Rocket:  ${m.L.name}`, `Engine:  ${m.P.name}`, `Testing: ${m.T.name}`,
    `Tools:   ${m.tools.map(t => t.name).join(", ")}`, `Length:  ${m.flyby ? "Flyby" : m.LF.name}`,
    `Power:   ${m.W.name} + ${m.B.name}`, `Antenna: ${m.C.name}`,
    `Weight:  ${kg(m.wet)} (rocket carries ${kg(m.L.cap)})`,
    `Cost:    ${money(r.spent)} of ${money(m.budget)}`, "",
    "WHAT HAPPENED", line, ...r.events.map(e => "• " + e), "",
    "Distances, sunlight and the rocket equation are real physics.",
    "Money (MC), speed budgets and risk odds are simplified for the game."
  ].join("\n");
}

async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  if (btn) { btn.textContent = "Copied ✓"; setTimeout(() => { btn.textContent = label; }, 1800); }
}

/* ---------- Render & events ---------- */
function render() {
  const views = { 1: renderTeam, 2: () => renderWizard(2), 3: () => renderWizard(3), 4: renderCheck, 5: renderLaunch, 6: renderLBPage };
  $("stage").innerHTML = views[step]();
  renderStepper();
  renderHUD();
  if (step === 4 && $("copyCode")) {
    $("copyCode").addEventListener("click", () => copyText(designCode(), $("copyCode"), "Copy design code"));
    $("loadCode").addEventListener("click", () => {
      const raw = $("codeIn").value.trim().replace(/^ORB-/, "");
      try {
        const s = JSON.parse(atob(raw));
        if (!validDesign(s)) throw 0;
        state = s; render(); $("codeNote").textContent = "Design loaded! Check the list above.";
      } catch (e) { $("codeNote").textContent = "That code didn't work. Check you copied all of it."; }
    });
  }
  if (step === 5 && $("beginBtn")) { craftProgress = 0; moveCraft(0, 1); $("beginBtn").addEventListener("click", runFlight); }
}

$("stage").addEventListener("click", e => {
  if (flying) return;
  const t = e.target;
  const size = t.closest("[data-size]");
  if (size) { team.size = +size.dataset.size; render(); return; }
  const sc = t.closest("[data-lbscope]");
  if (sc) { lbScope = sc.dataset.lbscope; refreshLB(); return; }
  const gt = t.closest("[data-goto]");
  if (gt) {
    const k = gt.dataset.goto;
    if (k === "size" || k === "difficulty") { go(1); return; }
    const q = QS.find(x => x.id === k); qi[q.step] = Math.max(0, qList(q.step).indexOf(q)); go(q.step); return;
  }
  const qb = t.closest("[data-q]");
  if (qb && !qb.disabled) { qi[step] = +qb.dataset.q; go(step); return; }
  const lb = t.closest("[data-lb]");
  if (lb) { lbFilter = lb.dataset.lb; refreshLB(); return; }
  const tryc = t.closest("[data-trycode]");
  if (tryc) {
    try { const s = JSON.parse(atob(tryc.dataset.trycode.replace(/^ORB-/, ""))); if (validDesign(s)) { state = s; go(4); } } catch (_) {}
    return;
  }
  const opt = t.closest("[data-group]");
  if (opt) {
    const g = opt.dataset.group, k = opt.dataset.key;
    if (g === "instr") {
      const has = state.instr.includes(k);
      if (has && state.instr.length > 1) state.instr = state.instr.filter(x => x !== k);
      else if (!has) state.instr = [...state.instr, k];
    } else state[g] = k;
    const y = scrollY; render(); scrollTo(0, y);
    return;
  }
  const nav = t.closest("[data-nav]");
  if (nav && !nav.disabled) { const n = +nav.dataset.nav; if ((n === 2 || n === 3) && n > step) qi[n] = firstOpen(n); go(n); }
});

// Names: update in place so typing doesn't lose focus
$("stage").addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-name]")) team.names[+t.dataset.name] = t.value;
  else if (t.matches("[data-teamname]")) team.name = t.value;
  else return;
  document.querySelectorAll("[data-owner]").forEach(el => { el.textContent = ownerOf(el.dataset.owner); });
  renderHUD();
});

/* ---------- Save / load / start over ---------- */
const SAVE_KEY = "orbitalMissionControl.v5";
$("saveBtn").addEventListener("click", () => {
  $("saveNote").textContent = store.set(SAVE_KEY, { state, team }) ? "Saved!" : "This browser can't save.";
});
$("loadBtn").addEventListener("click", () => {
  if (flying) return;
  const v = store.get(SAVE_KEY);
  if (!v || !validDesign(v.state)) { $("saveNote").textContent = "Nothing saved yet."; return; }
  state = v.state;
  if (v.team && v.team.size >= 1 && v.team.size <= 4) team = { size: v.team.size, name: v.team.name || "", names: (v.team.names || []).concat(["", "", "", ""]).slice(0, 4) };
  $("saveNote").textContent = "Loaded!";
  if (step === 5) step = 4;
  render();
});
$("resetBtn").addEventListener("click", () => {
  if (flying) return;
  const keep = state.difficulty;
  state = JSON.parse(JSON.stringify(DEFAULT)); state.difficulty = keep; qi = { 2: 0, 3: 0 };
  $("saveNote").textContent = "New mission started.";
  go(2);
});

$("lbBtn").addEventListener("click", () => { if (!flying) go(6); });

/* ---------- Moving space background ---------- */
(function space() {
  const c = $("space"), x = c.getContext("2d");
  let W, H, stars = [], shoot = null, last = 0;
  function size() {
    const d = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 5200) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.3, s: Math.random() * 0.12 + 0.02, p: Math.random() * 6.28, t: Math.random() * 1.5 + 0.5 }));
  }
  function draw(t) {
    const dt = Math.min(50, t - last); last = t;
    x.clearRect(0, 0, W, H);
    for (const [gx, gy, gr, col] of [[0.15, 0.25, 0.45, "185,162,255"], [0.85, 0.6, 0.5, "95,224,245"], [0.5, 1.0, 0.5, "255,160,190"]]) {
      const g = x.createRadialGradient(gx * W, gy * H, 0, gx * W, gy * H, gr * Math.max(W, H));
      g.addColorStop(0, `rgba(${col},.16)`); g.addColorStop(1, `rgba(${col},0)`);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    }
    for (const s of stars) {
      s.x -= s.s * dt * 0.06; if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
      x.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(s.p + t * 0.001 * s.t));
      x.fillStyle = "#fff"; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
    }
    x.globalAlpha = 1;
    if (!shoot && Math.random() < 0.004) shoot = { x: Math.random() * W, y: Math.random() * H * 0.5, l: 0 };
    if (shoot) {
      shoot.x += dt * 0.6; shoot.y += dt * 0.25; shoot.l += dt;
      const g = x.createLinearGradient(shoot.x - 90, shoot.y - 38, shoot.x, shoot.y);
      g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(255,255,255,.9)");
      x.strokeStyle = g; x.lineWidth = 2; x.beginPath(); x.moveTo(shoot.x - 90, shoot.y - 38); x.lineTo(shoot.x, shoot.y); x.stroke();
      if (shoot.l > 900) shoot = null;
    }
    if (!REDUCED) requestAnimationFrame(draw);
  }
  addEventListener("resize", size); size(); requestAnimationFrame(draw);
})();

render();
</script>
</body>
